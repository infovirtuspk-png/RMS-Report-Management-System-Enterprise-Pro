<div class="advances-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">Salary Advances</h1>
            <p class="text-muted">Staff advance loans, scheduled payroll deductions, and remaining balance tracking.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-primary" id="btnAddAdvance">
                <i class="fas fa-hand-holding-usd"></i> Issue Salary Advance
            </button>
        </div>
    </div>

    <!-- Filter & Stats -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <select class="form-select" id="advanceStatusFilter">
                        <option value="">All Advance Statuses</option>
                        <option value="approved">Approved / Outstanding</option>
                        <option value="partially_recovered">Partially Recovered</option>
                        <option value="fully_recovered">Fully Recovered</option>
                    </select>
                </div>
                <div class="col-md-6 text-end">
                    <span class="fs-6 text-muted me-2">Total Outstanding Advances:</span>
                    <span class="fs-5 fw-bold text-danger" id="totalOutstandingAdvances">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="advancesTable">
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Date</th>
                            <th>Employee Name</th>
                            <th>Advance Amount</th>
                            <th>Deduction Month</th>
                            <th>Remaining Balance</th>
                            <th>Status</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody id="advancesTableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Loading advance loans...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="advanceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Issue Salary Advance</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="advanceForm">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label required">Employee</label>
                            <select class="form-select" id="advStaffSelect" required>
                                <option value="">Select Employee</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Date Issued</label>
                            <input type="date" class="form-control" id="advDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Advance Amount</label>
                            <input type="number" step="0.01" min="1" class="form-control" id="advAmount" required placeholder="0.00">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Deduction Month</label>
                            <input type="month" class="form-control" id="advDeductionMonth" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Monthly Deduction Amount</label>
                            <input type="number" step="0.01" min="1" class="form-control" id="advDeductionAmount" required placeholder="0.00">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Reason / Purpose</label>
                            <textarea class="form-control" id="advReason" rows="2" placeholder="e.g. Emergency family medical expense"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Approve & Issue Advance</button>
                </div>
            </form>
        </div>
    </div>
</div>
