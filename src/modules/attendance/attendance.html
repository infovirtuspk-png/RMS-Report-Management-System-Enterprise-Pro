<div class="attendance-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">Staff Attendance</h1>
            <p class="text-muted">Daily staff check-ins, bulk attendance, working hours & overtime register.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-outline" id="btnMarkAllPresent">
                <i class="fas fa-check-double"></i> Mark All Active Present
            </button>
            <button class="btn btn-primary" id="btnSaveAttendance">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </div>
    </div>

    <!-- Date Selector & Quick Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-center g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Select Date:</label>
                    <input type="date" class="form-control" id="attendanceDatePicker">
                </div>
                <div class="col-md-8">
                    <div class="d-flex gap-2 justify-content-md-end align-items-end pt-md-4">
                        <span class="badge bg-success p-2"><i class="fas fa-user-check me-1"></i> Present: <span id="attCountPresent">0</span></span>
                        <span class="badge bg-danger p-2"><i class="fas fa-user-times me-1"></i> Absent: <span id="attCountAbsent">0</span></span>
                        <span class="badge bg-warning text-dark p-2"><i class="fas fa-clock me-1"></i> Late: <span id="attCountLate">0</span></span>
                        <span class="badge bg-info text-dark p-2"><i class="fas fa-plane-departure me-1"></i> Leave: <span id="attCountLeave">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Attendance Sheet Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Employee Name</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Check In</th>
                            <th>Check Out</th>
                            <th>Total Hours</th>
                            <th>Overtime (Hrs)</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="9" class="text-center py-4 text-muted">Loading attendance roster...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
