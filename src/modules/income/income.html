<div class="income-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">Income Management</h1>
            <p class="text-muted">Track, categorize, and manage all revenue streams.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-outline" id="btnManageCategories">
                <i class="fas fa-tags"></i> Categories
            </button>
            <button class="btn btn-primary" id="btnAddIncome">
                <i class="fas fa-plus"></i> Add Income
            </button>
        </div>
    </div>

    <!-- Stats Summary Cards -->
    <div class="dashboard-cards mb-4">
        <div class="stat-card">
            <div class="stat-card-icon income"><i class="fas fa-arrow-down"></i></div>
            <div class="stat-card-value" id="statTodayIncome">0.00</div>
            <div class="stat-card-label">Today's Total Income</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon income"><i class="fas fa-calendar-alt"></i></div>
            <div class="stat-card-value" id="statMonthIncome">0.00</div>
            <div class="stat-card-label">This Month's Income</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon profit"><i class="fas fa-layer-group"></i></div>
            <div class="stat-card-value" id="statIncomeCount">0</div>
            <div class="stat-card-label">Total Transactions</div>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="incomeSearchInput" placeholder="Search description, number, customer...">
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="incomeCategoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="incomePaymentFilter">
                        <option value="">All Payment Methods</option>
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Card">Card</option>
                        <option value="Online">Online</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="incomeDateFrom">
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="incomeDateTo">
                </div>
                <div class="col-md-1">
                    <button class="btn btn-outline w-100" id="btnResetIncomeFilters" title="Reset Filters"><i class="fas fa-undo"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="incomeTable">
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Date & Time</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Customer</th>
                            <th>Payment Method</th>
                            <th>Amount</th>
                            <th>Base Currency</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="incomeTableBody">
                        <tr><td colspan="9" class="text-center py-4 text-muted">Loading income records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Income Modal -->
<div class="modal fade" id="incomeModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="incomeModalTitle">Add Income</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="incomeForm">
                <div class="modal-body">
                    <input type="hidden" id="incomeEditId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label required">Date</label>
                            <input type="date" class="form-control" id="incomeDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Time</label>
                            <input type="time" class="form-control" id="incomeTime" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Category</label>
                            <select class="form-select" id="incomeCategorySelect" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Customer (Optional)</label>
                            <select class="form-select" id="incomeCustomerSelect">
                                <option value="">None / Walk-in</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label required">Description</label>
                            <input type="text" class="form-control" id="incomeDescription" placeholder="e.g. Consulting fees for project X" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required">Amount</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="incomeAmount" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required">Currency</label>
                            <select class="form-select" id="incomeCurrencySelect" required>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required">Payment Method</label>
                            <select class="form-select" id="incomePaymentMethod" required>
                                <option value="Cash">Cash</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Card">Card</option>
                                <option value="Online">Online</option>
                                <option value="Cheque">Cheque</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Invoice Reference</label>
                            <input type="text" class="form-control" id="incomeInvoiceRef" placeholder="e.g. RMS-INV-2026-000012">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Notes</label>
                            <input type="text" class="form-control" id="incomeNotes" placeholder="Additional details...">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveIncome">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Income Categories Modal -->
<div class="modal fade" id="incomeCategoriesModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Income Categories</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newIncomeCategoryForm" class="d-flex gap-2 mb-3">
                    <input type="text" class="form-control" id="newCategoryName" placeholder="New Category Name" required>
                    <button type="submit" class="btn btn-primary text-nowrap">Add</button>
                </form>
                <div class="list-group" id="incomeCategoriesList">
                </div>
            </div>
        </div>
    </div>
</div>
