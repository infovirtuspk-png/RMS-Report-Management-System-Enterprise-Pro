<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https: file:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: file:;">
    <title>RMS — Starting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .splash-card {
            width: 480px;
            height: 320px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(99, 102, 241, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: splashEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes splashEntrance {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Ambient Glow in Card */
        .ambient-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        .glow-1 {
            background: #6366f1;
            top: -60px;
            left: -60px;
        }

        .glow-2 {
            background: #06b6d4;
            bottom: -60px;
            right: -60px;
        }

        /* Logo Icon Box */
        .logo-box {
            position: relative;
            z-index: 2;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
            margin-bottom: 16px;
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45); }
            100% { transform: scale(1.06); box-shadow: 0 14px 30px rgba(6, 182, 212, 0.55); }
        }

        .brand-title {
            position: relative;
            z-index: 2;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            position: relative;
            z-index: 2;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Progress Bar */
        .progress-wrapper {
            position: relative;
            z-index: 2;
            width: 260px;
            margin-bottom: 12px;
        }

        .progress-bar-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #06b6d4, #6366f1);
            background-size: 200% 100%;
            border-radius: 4px;
            animation: progressFlow 1.8s infinite ease-in-out, shimmer 1.5s infinite linear;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }

        @keyframes progressFlow {
            0% { width: 0%; left: 0%; }
            50% { width: 65%; left: 20%; }
            100% { width: 0%; left: 100%; }
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .loading-status {
            position: relative;
            z-index: 2;
            font-size: 11px;
            color: #94a3b8;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .version-pill {
            position: absolute;
            bottom: 14px;
            font-size: 10px;
            color: #64748b;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <div class="logo-box">
            <i class="fas fa-chart-pie"></i>
        </div>

        <h1 class="brand-title">RMS Enterprise</h1>
        <p class="brand-subtitle">Report & Workspace Management</p>

        <div class="progress-wrapper">
            <div class="progress-bar-track">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="loading-status">Initializing workspace & security engine...</div>

        <div class="version-pill">v2.4.0 Pro Enterprise</div>
    </div>
</body>
</html>
